name: ci

on:
  push:
    branches: [main, cursor/**]
  pull_request:

jobs:
  format-and-tidy:
    name: clang-format and clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format and clang-tidy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-format-18 clang-tidy-18
      - name: clang-format
        run: make format-check
        env:
          CI: true
      - name: clang-tidy
        run: make tidy
        env:
          CI: true

  test:
    name: unit tests and mutation (example + self)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-18 llvm-18-dev
      - name: Build, test, mutation example
        run: make test
        env:
          CXX: clang++-18
          CC: clang-18
          LLVM_CONFIG: /usr/lib/llvm-18/bin/llvm-config
      - name: Install smoke (PATH layout + wrapper compile)
        run: make install-smoke
        env:
          CXX: clang++-18
          CC: clang-18
          LLVM_CONFIG: /usr/lib/llvm-18/bin/llvm-config

  package:
    name: package tarball (release dry-run)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-18 llvm-18-dev
      - name: Build and package
        run: |
          chmod +x scripts/package-release.sh scripts/install.sh
          VERSION=0.0.4-ci sh scripts/package-release.sh
        env:
          CXX: clang++-18
          CC: clang-18
          LLVM_CONFIG: /usr/lib/llvm-18/bin/llvm-config
      - name: Verify install layout from tarball
        run: |
          set -eu
          pkg=$(ls dist/mulation-bot-0.0.4-ci-linux-x86_64.tar.gz)
          work=$(mktemp -d)
          tar -C "$work" -xf "$pkg"
          stage="$work/mulation-bot-0.0.4-ci-linux-x86_64"
          test -x "$stage/bin/mulation"
          test -f "$stage/lib/libmulation_plugin.so"
          test -f "$stage/include/mulation/mulation.h"
          test -f scripts/install.sh

  # Dogfood: install the latest published runner (pin when cutting a release),
  # instrument example with the local plugin, run the consumer gate path.
  dogfood-release:
    name: dogfood release install + example gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang 18
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-18 llvm-18 llvm-18-dev
      - name: Install mulation from GitHub Release
        env:
          # Stay on last published tag until this PR's v0.0.4 tag exists.
          MULATION_VERSION: v0.0.3
          PREFIX: ${{ runner.temp }}/mulation-prefix
        run: |
          set -eu
          curl -fsSL \
            "https://github.com/YanChao1999/mulation-bot/releases/download/${MULATION_VERSION}/install.sh" \
            | sh
          echo "${PREFIX}/bin" >> "$GITHUB_PATH"
          "${PREFIX}/bin/mulation" --help >/dev/null
      - name: Build instrumented example with repo plugin
        run: make example
        env:
          CXX: clang++-18
          CC: clang-18
          LLVM_CONFIG: /usr/lib/llvm-18/bin/llvm-config
      - name: Mutation gate (git-diff + jobs)
        run: |
          set -eu
          report="${{ runner.temp }}/mulation-report.json"
          # min-score 0: example suite is intentionally weak; we only dogfood the path.
          mulation --min-score 0 -j 4 --json-out "$report" ./build/compare_tests
          test -f "$report"
          grep -q '"survivors"' "$report"
          # Verify PR-bot scripting without needing a live review thread.
          MULATION_DRY_RUN=1 sh scripts/pr-comment-survivors.sh "$report" | tee /tmp/pr-bot-dry.txt
          grep -q 'dry-run would comment' /tmp/pr-bot-dry.txt

